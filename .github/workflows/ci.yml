name: PyMentor AI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: FastAPI Backend & Eval Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check app tests
          mypy app
          pytest -q
      - run: python eval/runners/benchmark.py

  executor:
    name: Python Sandbox Executor Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: executor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
